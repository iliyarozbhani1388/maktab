name: Maktabkhooneh Login Test

on:
  workflow_dispatch:

jobs:
  login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Login to Maktabkhooneh
        run: |
          cat > script.py <<'PY'
          from playwright.sync_api import sync_playwright

          USERNAME = "09198631546"
          PASSWORD = "Iliya123&"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              print("Opening Maktabkhooneh...")

              page.goto(
                  "https://mirza.maktabkhooneh.org/courses",
                  wait_until="networkidle"
              )

              print("Initial URL:", page.url)
              print("Title:", page.title())

              # نمایش اطلاعات کلی فرم‌ها برای پیدا کردن فیلد ورود
              print("Inputs:")

              for i, element in enumerate(page.locator("input").all()):
                  try:
                      print(
                          i,
                          "type=", element.get_attribute("type"),
                          "name=", element.get_attribute("name"),
                          "placeholder=", element.get_attribute("placeholder")
                      )
                  except:
                      pass

              print("Login page inspection completed.")

              browser.close()
          PY

          python script.py
