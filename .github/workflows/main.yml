name: Maktabkhooneh Login Test

on:
  workflow_dispatch:

jobs:
  login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Test Login
        run: |
          cat > script.py <<'PY'
          from playwright.sync_api import sync_playwright

          USERNAME = "09198631546"
          PASSWORD = "Iliya123&"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              print("Opening website...")
              page.goto(
                  "https://mirza.maktabkhooneh.org/courses",
                  wait_until="networkidle"
              )

              print("URL:", page.url)
              print("Title:", page.title())

              # فعلاً فقط صفحه را باز می‌کنیم
              # بعد از بررسی فرم ورود، فیلدهای صحیح را اضافه می‌کنیم.

              browser.close()
          PY

          python script.py
